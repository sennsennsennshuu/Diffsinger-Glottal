# ============================================================================
# DiffSinger v3 + SFC Breathness — 6 说话人多语言声学模型配置
# ============================================================================

bases: ["configs/base_v3.yaml"]

# ---------- 数据配置 ----------
data:
  dictionaries:
    zh: "dictionaries/opencpop-extension.txt"
    ja: "dictionaries/dictionary-ja.txt"

  extra_phonemes: []
  merged_phoneme_groups:
    - ["zh/i", "ja/i",]
    - ["SP", "ja/cl"]
  sources:
    # ---- 歌手 0: opencpop (zh) ----
    - raw_data_dir: "data/opencpop/raw"
      speaker: opencpop
      spk_id: 0
      language: zh
      test_prefixes:
        - "2001000001"
        - "2001000002"
        - "2001000003"
    # ---- 歌手 1: itako (ja) ----
    - raw_data_dir: "data/itako/raw"
      speaker: itako
      spk_id: 1
      language: ja
      test_prefixes:
        - "itako02_seg036"
        - "itako02_seg037"
        - "itako02_seg038"
    # ---- 歌手 2: kiritan (ja) ----
    - raw_data_dir: "data/kiritan/raw"
      speaker: kiritan
      spk_id: 2
      language: ja
      test_prefixes:
        - "01_000"
        - "02_000"
        - "03_000"
    # ---- 歌手 3: karasu (ja) ----
    - raw_data_dir: "data/karasu/raw"
      speaker: karasu
      spk_id: 3
      language: ja
      test_prefixes:
        - "bc_seg0"

# ---------- 二值化配置 ----------
binarizer:
  binary_data_dir: "data/test4s/binary/acoustic"
  num_workers: 4

  extractors:
    pitch_extraction:
      method: rmvpe
      model_path: "assets/rmvpe/model.pt"
      f0_min: 65
      f0_max: 1100
    harmonic_noise_separation:
      method: vr
      model_path: "assets/vr/model.pt"

  features:
    audio_sample_rate: 44100
    hop_size: 512
    fft_size: 2048
    win_size: 2048

    spectrogram:
      type: mel
      num_bins: 128
      fmin: 40
      fmax: 16000

    energy:
      enabled: true
      smooth_width: 0.12

    breathiness:
      enabled: true
      smooth_width: 0.12

    voicing:
      enabled: true
      smooth_width: 0.12

    tension:
      enabled: true
      smooth_width: 0.12

    # 非周期分量 mel 谱（给 CVAE 提供真实 aperiodic ground truth）
    aperiodic_mel:
      enabled: true

  augmentation:
    random_pitch_shifting:
      enabled: true
      range: [-5., 5.]
      scale: 0.75
    random_time_stretching:
      enabled: true
      range: [0.5, 2.]
      scale: 0.75

# ---------- 模型配置 ----------
model:
  use_spk_id: true                                    # 6 个说话人
  num_spk: 4
  condition_dim: 256

  linguistic_encoder:
    use_lang_id: true                                 # zh/ja/en 三语言
    num_lang: 2
    arch: fs2
    kwargs:
      dropout: 0.1
      use_pos_embed: true
      num_layers: 4
      num_heads: 2
      ffn_kernel_size: 3
      ffn_act: gelu
      use_rope: true
      rel_pos: true

  embeddings:
    use_energy_embed: false
    use_breathiness_embed: true
    use_key_shift_embed: true
    use_speed_embed: true

  normalization:
    spec_min: -6.0
    spec_max: 0.

  spec_decoder:
    # ---- 浅扩散（aux decoder 只给 brathy loss 用） ----
    use_shallow_diffusion: true
    aux_decoder_grad: 0.1                              # 给 encoder 10% aux 梯度正则化，防 4 说话人 transformer 野掉
    aux_loss_lambda: 0.2                               # 0.1→0.2: 原版 v3 值，增强 aux 对 total_loss 贡献
    aux_decoder_arch: convnext
    aux_decoder_kwargs:
      num_channels: 512
      num_layers: 6
      kernel_size: 7
      dropout_rate: 0.4

    # ---- 扩散 ----
    diffusion_type: reflow
    t_start: 0.4
    time_scale_factor: 1000
    sampling_algorithm: euler
    sampling_steps: 20

    # ---- 骨干 ----
    backbone_arch: lynxnet
    backbone_kwargs:
      num_channels: 1024
      num_layers: 6
      kernel_size: 31
      dropout_rate: 0.1
      strong_cond: true

    max_beta: 0.06

  # ---- SFC Breathness ----
  sweet_breathy:
    enabled: true
    use_lf_glottal: true
    lf_param_dim: 5
    glottal_hidden_dim: 128

# ---------- 训练配置 ----------
training:
  loss:
    spec_decoder:
      main_loss_type: L2
      main_loss_log_norm: false
      aux_loss_type: L1
    sweet_breathy:
      enabled: false
      mel_l1_weight: 1.0
      high_freq_weight: 1.0
      spectral_tilt_weight: 0.5
      breathiness_weight: 0.0                     # 声学模型无 breathiness 预测头，GT vs GT = 0
      voicing_weight: 0.0                         # 声学模型无 voicing 预测头，GT vs GT = 0
      warmup_start_step: 20000
      warmup_full_step: 64000
      period_singer_loss_scale: 0.3                    # CVAE loss 只占 30%，防 aux_out 过拟合
      perceptual_loss_scale: 0.3                       # 感知 loss 只占 30%，防 aux_out 过拟合
      # Per-loss warmup (start_step, full_step) — linear ramp
      loss_warmup:
        glottal_breathiness: [0, 5000]
      # EMA magnitude normalization (decay=0.99, ~100 steps to converge)
      adaloss_ema_decay: 0.99

  dataloader:
    max_batch_frames: 50000                            # 6 说话人显存紧张
    max_batch_size: 48
    max_val_batch_frames: 20000
    max_val_batch_size: 1
    frame_count_grid: 6
    num_workers: 4
    prefetch_factor: 2

  optimizer:
    cls: torch.optim.AdamW
    kwargs:
      lr: 0.0006                                      # 0.0004→0.0006: 对齐原版 v3
      betas: [0.9, 0.98]
      weight_decay: 0                           # 微量 L2 正则：6 loss 路径防权重漂移
    aux_lr_scale: 1.0                                   # 0.5→1.0: LayerScale 1e-6 + 0.5×LR 让 aux_out 长期垃圾拖累 reflow
    glottal_lr_scale: 2.0                               # GlottalPredictor（LF 模型小，需更强信号）

  lr_scheduler:
    cls: torch.optim.lr_scheduler.StepLR
    kwargs:
      step_size: 50000                                  # 120k/8 (4 decays over full training)
      gamma: 0.5                                       # gentler decay: LR stays above 1e-4 at 120k
    unit: "step"

  trainer:
    unit: "step"
    min_steps: 0
    max_steps: 120000
    min_epochs: 0
    max_epochs: 1000
    val_every_n_units: 2000
    log_every_n_steps: 100
    num_sanity_val_steps: 1

    checkpoints:
      - tag: "best"
        type: "expression"
        expression: "total_loss"
        save_top_k: 5
        mode: "min"
        weights_only: false
      - tag: "temp"
        type: "periodic"
        unit: "step"
        every_n_units: 2000
        since_m_units: 0
        save_last_k: 2
        weights_only: false
      - tag: "perm"
        type: "periodic"
        unit: "step"
        every_n_units: 20000
        since_m_units: 60000
        save_last_k: -1
        weights_only: false

    precision: "16-mixed"
    accelerator: "auto"
    devices: "auto"
    num_nodes: 1
    strategy:
      name: "auto"
      kwargs:
        process_group_backend: nccl
        find_unused_parameters: false
    accumulate_grad_batches: 1                                 # 6 说话人 7 路 loss → 梯度竞争，x4 平滑
    gradient_clip_val: 3.0                             # 多说话人防梯度爆炸

  validation:
    use_vocoder: true
    spec_vmin: -14.
    spec_vmax: 4.
    max_plots: 10

  finetuning:
    pretraining_enabled: false
    pretraining_from: null
    pretraining_include_params: ["model.*"]
    pretraining_exclude_params: []
    freezing_enabled: false
    freezing_include_params: []
    freezing_exclude_params: []

  weight_averaging:
    ema_enabled: true                                   # 多模块训练防过拟合，稳定权重
    ema_decay: 0.999
    ema_include_params: ["model.*"]
    ema_exclude_params: []

# ---------- 推理配置 ----------
inference:
  vocoder:
    vocoder_type: "pc-nsf-hifigan"
    vocoder_path: "checkpoints/pc_nsf_hifigan_44.1k_hop512_128bin_2025.02/model.ckpt"
